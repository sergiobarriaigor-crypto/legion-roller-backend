<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Flyover render</title>
<link href="/flyover-render/vendor/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  /* Resolución final del video (vertical 9:16, 720p) -- Puppeteer setea el
     viewport a este mismo tamaño, sin escalar, para que el screenshot
     coincida 1:1 con lo que ffmpeg va a codificar. */
  #map { width: 720px; height: 1280px; }
</style>
</head>
<body>
<div id="map"></div>
<script type="module">
  // MapLibre GL JS v6 no publica build UMD (script clásico con global
  // `maplibregl`) -- solo módulos ES. Se importa el .mjs servido por el
  // propio backend (node_modules/maplibre-gl/dist, ver main.ts), sin
  // depender de ningún CDN externo para esto.
  //
  // Página vanilla sin build step a propósito: Puppeteer sobre un build de
  // Next sería mucho más frágil y pesado de arrancar por request. Solo
  // necesita dibujar el mapa 3D y moverse por keyframes fijos -- nada de
  // React acá. Node (flyover-render.service.ts) empuja datos vía
  // page.evaluate; esta página nunca llama de vuelta a Node.
  import { Map as MaplibreMap } from '/flyover-render/vendor/maplibre-gl.mjs';

  // Estilo "satelital": mismas dos capas satelitales que ya usa el mapa en
  // vivo y la tarjeta de recorrido (MapaView.tsx / tarjetaRecorrido.ts) --
  // Esri World Imagery (foto) + Reference/World_Boundaries_and_Places
  // (calles/nombres encima), gratis y sin API key, más una fuente de
  // elevación real (ver 'terreno-dem' abajo). Sigue sin haber edificios 3D
  // vectoriales acá (eso queda exclusivo del estilo Liberty con edificios),
  // pero el terreno real sí muestra el relieve verdadero (cerros, costa) en
  // vez de una foto aérea completamente plana e inclinada.
  var ESTILO_SATELITAL = {
    version: 8,
    sources: {
      'esri-satelite': {
        type: 'raster',
        tiles: [
          'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        ],
        tileSize: 256,
      },
      'esri-etiquetas': {
        type: 'raster',
        tiles: [
          'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
        ],
        tileSize: 256,
      },
      // AWS Terrain Tiles (formato "Terrarium"): gratis, sin API key, sin
      // registro -- mismo criterio que Esri/OpenFreeMap ya usados acá. Es
      // un servicio externo gratuito sin SLA formal: si algún tile de
      // elevación falla, MapLibre simplemente lo trata como plano ahí, sin
      // romper el resto del render.
      'terreno-dem': {
        type: 'raster-dem',
        tiles: [
          'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',
        ],
        tileSize: 256,
        encoding: 'terrarium',
        maxzoom: 15,
      },
    },
    layers: [
      { id: 'satelite', type: 'raster', source: 'esri-satelite' },
      { id: 'etiquetas', type: 'raster', source: 'esri-etiquetas' },
    ],
    // exaggeration > 1 a propósito: el relieve real de Puerto Montt/Puerto
    // Varas es de cerros suaves, no montañas -- sin exagerar un poco se
    // notaría muy poco en un video de unos segundos.
    terrain: { source: 'terreno-dem', exaggeration: 1.5 },
    // Sin esto, el horizonte de una cámara inclinada con terreno real se ve
    // con un corte duro contra el vacío -- el degradé lo disimula. Colores
    // acordes al tema navy/dorado del resto de la app.
    sky: {
      'sky-color': '#0b121c',
      'horizon-color': '#8ea6c9',
      'fog-color': '#c9d6e8',
      'sky-horizon-blend': 0.5,
    },
  };

  var estiloElegido = new URLSearchParams(location.search).get('estilo');
  var estiloMapa =
    estiloElegido === 'satelital'
      ? ESTILO_SATELITAL
      : 'https://tiles.openfreemap.org/styles/liberty';

  var map = new MaplibreMap({
    container: 'map',
    style: estiloMapa,
    center: [0, 0],
    zoom: 15,
    pitch: 60,
    // MapLibre limita el pitch a 60° por defecto -- sin esto, los keyframes
    // con pitch más alto (ver PITCH_CAMARA en geo-flyover.util.ts, cámara
    // "pegada al piso") quedarían recortados en silencio a 60 igual. 75 en
    // vez de un valor más extremo: un pitch=78 real rompió la generación en
    // Railway (ver comentario en geo-flyover.util.ts).
    maxPitch: 75,
    interactive: false,
    attributionControl: false,
  });

  window.__mapaListo = false;
  map.on('load', function () {
    window.__mapaListo = true;
  });

  // Dibuja el trazado de la ruta como una línea dorada sobre el mapa 3D
  // (mismo color #C99A3D que usa el resto de la app para rutas).
  window.__dibujarRuta = function (geojson) {
    map.addSource('ruta-flyover', { type: 'geojson', data: geojson });
    map.addLayer({
      id: 'ruta-flyover',
      type: 'line',
      source: 'ruta-flyover',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#C99A3D', 'line-width': 5 },
    });
  };

  // Posiciona la cámara de forma síncrona (sin animación) y resuelve recién
  // cuando MapLibre terminó de pintar el frame (evento 'idle') -- esto es lo
  // que desacopla el tiempo real de renderizado de la duración final del
  // video: no importa cuánto tarde cada frame, Node espera a que esté listo
  // antes de capturar el screenshot y pedir el siguiente.
  window.__jumpTo = function (keyframe) {
    return new Promise(function (resolve) {
      map.once('idle', function () {
        resolve();
      });
      map.jumpTo({
        center: keyframe.center,
        zoom: keyframe.zoom,
        pitch: keyframe.pitch,
        bearing: keyframe.bearing,
      });
    });
  };
</script>
</body>
</html>
